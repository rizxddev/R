<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PteroRemote Ultra - Live Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .terminal { font-family: 'Fira Code', monospace; line-height: 1.4; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#020617] text-slate-200">

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 hidden">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-md shadow-2xl">
            <h1 class="text-3xl font-black text-white mb-2 italic">PTERO<span class="text-blue-500">UI</span></h1>
            <p class="text-slate-400 text-sm mb-6">Masukkan kredensial panel Pterodactyl Anda.</p>
            <div class="space-y-4">
                <input type="text" id="domain" placeholder="https://panel.anda.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="apiKey" placeholder="ptlc_xxxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="saveLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20">CONNECT</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <nav class="border-b border-slate-800 p-4 glass sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <span class="font-black text-blue-500 italic text-xl tracking-tighter">PTERO_REMOTE</span>
                <select id="serverSelect" onchange="switchServer()" class="bg-slate-800 border-none rounded-lg text-xs font-bold px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800">
                    <div id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></div>
                    <span id="statusText" class="text-[10px] font-black uppercase">Checking...</span>
                </div>
                <button onclick="logout()" class="text-xs font-bold text-slate-500 hover:text-rose-500">LOGOUT</button>
            </div>
        </nav>

        <div class="p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1600px] mx-auto">
            
            <div class="lg:col-span-8 space-y-6">
                <div class="flex gap-2">
                    <button onclick="sendPower('start')" class="px-6 py-2 rounded-xl text-xs font-black bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 hover:bg-emerald-500 hover:text-white transition">START</button>
                    <button onclick="sendPower('restart')" class="px-6 py-2 rounded-xl text-xs font-black bg-amber-500/10 text-amber-500 border border-amber-500/20 hover:bg-amber-500 hover:text-white transition">RESTART</button>
                    <button onclick="sendPower('stop')" class="px-6 py-2 rounded-xl text-xs font-black bg-rose-500/10 text-rose-500 border border-rose-500/20 hover:bg-rose-500 hover:text-white transition">STOP</button>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
                    <canvas id="resourceChart" height="100"></canvas>
                </div>

                <div class="bg-black rounded-3xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col h-[500px]">
                    <div class="bg-slate-900/80 px-5 py-3 border-b border-slate-800 flex justify-between items-center text-[10px] font-bold tracking-widest text-slate-500">
                        <span>LIVE CONSOLE</span>
                        <span id="wsStatus" class="text-rose-500">DISCONNECTED</span>
                    </div>
                    <div id="console-logs" class="flex-1 overflow-y-auto p-5 terminal text-[12px] bg-[#020202] space-y-1 text-slate-300">
                        <div class="text-blue-500 animate-pulse italic">Memulai koneksi ke server...</div>
                    </div>
                    <div class="p-4 bg-slate-900/30 flex gap-3 border-t border-slate-800">
                        <span class="text-blue-500 font-bold self-center">❯</span>
                        <input type="text" id="cmdInput" onkeydown="if(event.key==='Enter') executeCommand()" class="w-full bg-transparent border-none outline-none text-sm terminal" placeholder="Ketik perintah...">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="bg-slate-900 border border-slate-800 rounded-3xl flex flex-col h-full min-h-[600px]">
                    <div class="p-5 border-b border-slate-800 flex justify-between items-center font-black text-xs tracking-widest text-slate-400">
                        <span>FILE MANAGER</span>
                        <button onclick="fetchFiles()" class="text-blue-500 hover:rotate-180 transition-transform duration-500">↻</button>
                    </div>
                    <div id="fileList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="editor-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 hidden p-6">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-5xl rounded-3xl overflow-hidden flex flex-col h-[85vh] shadow-2xl">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/30">
                <h3 id="editing-filename" class="font-bold text-blue-400 text-sm italic">Editor</h3>
                <button onclick="closeEditor()" class="text-slate-500 hover:text-white">CLOSE</button>
            </div>
            <textarea id="file-content" class="flex-1 bg-black text-emerald-400 terminal text-sm p-6 outline-none resize-none"></textarea>
            <div class="p-5 border-t border-slate-800 flex justify-end gap-4">
                <button onclick="saveFileContent()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-xl font-bold transition">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <script>
        let chart, socket, currentServer, monitorInterval, reconnectTimer;
        let isReconnecting = false;
        let currentFilePath = "";

        // --- AUTH ---
        function saveLogin() {
            const d = document.getElementById('domain').value.trim().replace(/\/$/, "");
            const k = document.getElementById('apiKey').value.trim();
            if (d && k) {
                localStorage.setItem('ptero_domain', d);
                localStorage.setItem('ptero_key', k);
                location.reload();
            }
        }
        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            if (!localStorage.getItem('ptero_domain')) document.getElementById('login-screen').classList.remove('hidden');
            else { initDashboard(); }
        };

        async function initDashboard() {
            initChart();
            await fetchServers();
        }

        async function fetchServers() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            try {
                const res = await fetch(`${d}/api/client`, { headers: { 'Authorization': `Bearer ${k}`, 'Accept': 'application/json' } });
                const json = await res.json();
                const select = document.getElementById('serverSelect');
                select.innerHTML = json.data.map(s => `<option value="${s.attributes.identifier}">${s.attributes.name}</option>`).join('');
                if (json.data.length > 0) {
                    currentServer = json.data[0].attributes.identifier;
                    startAll();
                }
            } catch (e) { console.error(e); logout(); }
        }

        function switchServer() {
            currentServer = document.getElementById('serverSelect').value;
            chart.data.labels = []; chart.data.datasets.forEach(d => d.data = []); chart.update();
            if (socket) socket.close();
            startAll();
        }

        function startAll() {
            startStats();
            connectWS();
            fetchFiles();
        }

        // --- STATS (CPU/RAM) ---
        function startStats() {
            if (monitorInterval) clearInterval(monitorInterval);
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            monitorInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${d}/api/client/servers/${currentServer}/resources`, { headers: { 'Authorization': `Bearer ${k}` } });
                    const data = await res.json();
                    const r = data.attributes.resources;
                    const state = data.attributes.current_state;
                    document.getElementById('statusText').innerText = state;
                    document.getElementById('statusDot').className = `w-2 h-2 rounded-full ${state === 'running' ? 'bg-emerald-500' : 'bg-rose-500'}`;
                    updateChartData(r.cpu_absolute, (r.memory_bytes / 1024 / 1024).toFixed(0));
                } catch (e) {}
            }, 3000);
        }

        // --- WEBSOCKET (LIVE CONSOLE) ---
        async function connectWS() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            try {
                const res = await fetch(`${d}/api/client/servers/${currentServer}/websocket`, { headers: { 'Authorization': `Bearer ${k}` } });
                const wsData = (await res.json()).data;

                if (socket) socket.close();
                socket = new WebSocket(wsData.socket);

                socket.onopen = () => {
                    isReconnecting = false;
                    document.getElementById('wsStatus').innerText = "CONNECTED";
                    document.getElementById('wsStatus').className = "text-emerald-500";
                    socket.send(JSON.stringify({ "event": "auth", "args": [wsData.token] }));
                };

                socket.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    if (data.event === 'console output' || data.event === 'install output') {
                        logToConsole(data.args[0]);
                    }
                    if (data.event === 'status') {
                        logToConsole(`System: Server is ${data.args[0]}`, "text-blue-400 font-bold");
                    }
                };

                socket.onclose = () => {
                    document.getElementById('wsStatus').innerText = "DISCONNECTED - RETRYING...";
                    document.getElementById('wsStatus').className = "text-rose-500 animate-pulse";
                    if (!isReconnecting) {
                        isReconnecting = true;
                        setTimeout(connectWS, 5000);
                    }
                };
            } catch (e) {
                logToConsole("Gagal terhubung ke WebSocket API.", "text-rose-500");
                setTimeout(connectWS, 10000);
            }
        }

        // --- TERMINAL UTILS ---
        function logToConsole(msg, cls = "text-slate-300") {
            const c = document.getElementById('console-logs');
            const div = document.createElement('div');
            div.className = `whitespace-pre-wrap ${cls}`;
            // Membersihkan ANSI color codes agar teks rapi
            div.innerText = msg.replace(/\x1B\[[0-9;]*[mK]/g, "");
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
            if (c.childNodes.length > 500) c.removeChild(c.firstChild);
        }

        async function executeCommand() {
            const i = document.getElementById('cmdInput'), cmd = i.value; if (!cmd) return;
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            i.value = '';
            // Kirim command via WebSocket jika terhubung, jika tidak via HTTP
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ "event": "send command", "args": [cmd] }));
            } else {
                await fetch(`${d}/api/client/servers/${currentServer}/command`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
            }
        }

        // --- POWER ---
        async function sendPower(signal) {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ "event": "send stats", "args": [signal] })); // Beberapa panel mendukung ini
            }
            await fetch(`${d}/api/client/servers/${currentServer}/power`, {
                method: 'POST', headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ signal })
            });
        }

        // --- FILE MANAGER ---
        async function fetchFiles() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            const list = document.getElementById('fileList');
            list.innerHTML = '<div class="p-10 text-center opacity-30 text-[10px] tracking-widest">LOADING...</div>';
            try {
                const res = await fetch(`${d}/api/client/servers/${currentServer}/files/list`, { headers: { 'Authorization': `Bearer ${k}` } });
                const json = await res.json();
                list.innerHTML = json.data.map(f => {
                    const isDir = f.attributes.is_directory;
                    return `<div onclick="${isDir ? '' : `openEditor('${f.attributes.name}')`}" class="flex justify-between p-3 hover:bg-slate-800/50 rounded-xl cursor-pointer group transition-all">
                        <div class="flex gap-3 items-center">
                            <span>${isDir ? '📁' : '📄'}</span>
                            <span class="text-xs ${isDir ? 'text-blue-400 font-bold' : 'text-slate-300'}">${f.attributes.name}</span>
                        </div>
                        <span class="text-[9px] font-bold text-slate-600">${isDir ? 'DIR' : (f.attributes.size/1024).toFixed(1)+'KB'}</span>
                    </div>`;
                }).join('');
            } catch (e) { list.innerHTML = 'Error.'; }
        }

        async function openEditor(file) {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            document.getElementById('editing-filename').innerText = `EDITING: ${file}`;
            document.getElementById('file-content').value = "LOADING...";
            document.getElementById('editor-modal').classList.remove('hidden');
            currentFilePath = file;
            try {
                const res = await fetch(`${d}/api/client/servers/${currentServer}/files/contents?file=${file}`, { headers: { 'Authorization': `Bearer ${k}` } });
                document.getElementById('file-content').value = await res.text();
            } catch (e) { closeEditor(); }
        }

        async function saveFileContent() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            await fetch(`${d}/api/client/servers/${currentServer}/files/write?file=${currentFilePath}`, {
                method: 'POST', headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'text/plain' },
                body: document.getElementById('file-content').value
            });
            alert("Berhasil disimpan!"); closeEditor();
        }
        function closeEditor() { document.getElementById('editor-modal').classList.add('hidden'); }

        // --- CHART ---
        function initChart() {
            const ctx = document.getElementById('resourceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'CPU %', borderColor: '#3b82f6', data: [], tension: 0.4, pointRadius: 0, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.05)' },
                    { label: 'RAM MB', borderColor: '#10b981', data: [], tension: 0.4, pointRadius: 0, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.05)' }
                ]},
                options: { 
                    responsive: true, plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } } }
                }
            });
        }
        function updateChartData(cpu, ram) {
            if (chart.data.labels.length > 20) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift(); }
            chart.data.labels.push(""); chart.data.datasets[0].data.push(cpu); chart.data.datasets[1].data.push(ram);
            chart.update('none');
        }
    </script>
</body>
</html>
