<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PteroRemote Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code&display=swap');
        .terminal { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen">

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 hidden">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-white">Ptero Remote Login</h1>
            <div class="space-y-4">
                <input type="text" id="domain" placeholder="https://panel.example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="apiKey" placeholder="ptlc_api_key_anda" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="saveLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition">CONNECT</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <nav class="border-b border-slate-800 p-4 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span class="font-black text-blue-500 italic uppercase">Ptero_Remote</span>
                <select id="serverSelect" onchange="switchServer()" class="bg-slate-800 border-none rounded-lg text-xs p-2 outline-none"></select>
            </div>
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-rose-500 font-bold">LOGOUT</button>
        </nav>

        <div class="p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1400px] mx-auto">
            <div class="lg:col-span-8 space-y-6">
                <div class="flex gap-2">
                    <button onclick="sendPower('start')" class="bg-emerald-600 px-4 py-2 rounded-lg text-xs font-bold">START</button>
                    <button onclick="sendPower('stop')" class="bg-rose-600 px-4 py-2 rounded-lg text-xs font-bold">STOP</button>
                </div>
                <div class="bg-black rounded-2xl border border-slate-800 overflow-hidden flex flex-col h-[450px]">
                    <div id="console-logs" class="flex-1 overflow-y-auto p-4 terminal text-[11px] space-y-1 text-slate-300"></div>
                    <div class="p-3 bg-slate-900/50 border-t border-slate-800 flex gap-2">
                        <span class="text-blue-500 font-bold">❯</span>
                        <input type="text" id="cmdInput" onkeydown="if(event.key==='Enter') executeCommand()" class="bg-transparent border-none outline-none w-full text-sm" placeholder="Enter command...">
                    </div>
                </div>
            </div>
            <div class="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl h-[600px] flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-800 font-bold text-xs tracking-widest text-slate-500 uppercase">File Manager</div>
                <div id="fileList" class="flex-1 overflow-y-auto p-2"></div>
            </div>
        </div>
    </div>

    <script>
        let socket, currentServer;

        // Validasi Awal: Cek apakah sudah login
        window.onload = () => {
            const d = localStorage.getItem('ptero_domain');
            const k = localStorage.getItem('ptero_key');
            if (!d || !k) {
                document.getElementById('login-screen').classList.remove('hidden');
            } else {
                document.getElementById('main-content').classList.remove('hidden');
                fetchServers();
            }
        };

        function saveLogin() {
            const d = document.getElementById('domain').value.trim().replace(/\/$/, "");
            const k = document.getElementById('apiKey').value.trim();
            if (d && k) {
                localStorage.setItem('ptero_domain', d);
                localStorage.setItem('ptero_key', k);
                location.reload();
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function fetchServers() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            try {
                const res = await fetch(`${d}/api/client`, {
                    headers: { 'Authorization': `Bearer ${k}`, 'Accept': 'application/json' }
                });
                if (!res.ok) throw new Error("Auth Failed");
                const json = await res.json();
                const select = document.getElementById('serverSelect');
                select.innerHTML = json.data.map(s => `<option value="${s.attributes.identifier}">${s.attributes.name}</option>`).join('');
                if (json.data.length > 0) {
                    currentServer = json.data[0].attributes.identifier;
                    connectWS();
                    fetchFiles();
                }
            } catch (e) {
                console.error(e);
                // Jangan langsung logout agar tidak mental balik, beri peringatan saja
                alert("Gagal koneksi ke panel. Cek API Key & Domain (pastikan HTTPS)");
            }
        }

        async function connectWS() {
            if (socket) socket.close();
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            try {
                const res = await fetch(`${d}/api/client/servers/${currentServer}/websocket`, {
                    headers: { 'Authorization': `Bearer ${k}` }
                });
                const wsData = (await res.json()).data;
                socket = new WebSocket(wsData.socket);
                socket.onopen = () => socket.send(JSON.stringify({ event: "auth", args: [wsData.token] }));
                socket.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    if (data.event === 'console output') logToConsole(data.args[0]);
                };
            } catch (e) { logToConsole("WebSocket Error..."); }
        }

        function logToConsole(msg) {
            const c = document.getElementById('console-logs');
            const d = document.createElement('div');
            d.innerText = msg.replace(/\x1B\[[0-9;]*[mK]/g, "");
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        async function executeCommand() {
            const i = document.getElementById('cmdInput');
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            await fetch(`${d}/api/client/servers/${currentServer}/command`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: i.value })
            });
            i.value = '';
        }

        async function fetchFiles() {
            const d = localStorage.getItem('ptero_domain'), k = localStorage.getItem('ptero_key');
            const list = document.getElementById('fileList');
            try {
                const res = await fetch(`${d}/api/client/servers/${currentServer}/files/list`, {
                    headers: { 'Authorization': `Bearer ${k}` }
                });
                const json = await res.json();
                list.innerHTML = json.data.map(f => `<div class="p-2 text-xs border-b border-slate-800/50">${f.attributes.is_directory ? '📁' : '📄'} ${f.attributes.name}</div>`).join('');
            } catch (e) {}
        }
    </script>
</body>
</html>
